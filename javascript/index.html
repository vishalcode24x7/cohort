<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Piano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="piano">
        <div class="key white">C</div>
        <div class="key black">C#</div>

        <div class="key white">D</div>
        <div class="key black">D#</div>

        <div class="key white">E</div>

        <div class="key white">F</div>
        <div class="key black">F#</div>

        <div class="key white">G</div>
        <div class="key black">G#</div>

        <div class="key white">A</div>
        <div class="key black">A#</div>

        <div class="key white">B</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
